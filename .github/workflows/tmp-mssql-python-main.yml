name: TEMP mssql-python main check

on:
  pull_request:

jobs:
  check:
    name: driver ${{ matrix.driver }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        driver: [released, main]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: BenchMark!Pass123
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'BenchMark!Pass123' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v7
        if: matrix.driver == 'main'
        with:
          repository: microsoft/mssql-python
          ref: main
          path: mssqlpy
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ODBC driver and build tools
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 build-essential cmake unixodbc-dev
      - run: pip install -e ".[dev]"
      - name: Build mssql-python main from source
        if: matrix.driver == 'main'
        run: |
          git -C mssqlpy log -1 --format='mssql-python main at %h %ad %s' --date=short
          pip install pybind11 setuptools wheel
          ( cd mssqlpy/mssql_python/pybind && chmod +x build.sh && ./build.sh )
          bash mssqlpy/eng/scripts/install-mssql-py-core.sh
          echo "PYTHONPATH=$PWD/mssqlpy" >> "$GITHUB_ENV"
      - name: Which driver
        run: |
          python -c "import mssql_python, inspect; from mssql_python import parameter_helper as p; print('mssql_python', mssql_python.__version__, 'from', mssql_python.__file__); print('has merged pyformat rewrite:', hasattr(p, '_PYFORMAT_TOKEN'))"
          pip list 2>/dev/null | grep -i -E "mssql|sqlalchemy|pyodbc|pandas"
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pytest -q
      - name: Integration
        if: ${{ !cancelled() }}
        run: python tests/integration.py
      - name: Dialect patch bench
        if: ${{ !cancelled() }}
        run: python tests/dialect_patch_bench.py
      - name: Benchmark
        if: ${{ !cancelled() }}
        run: python tests/benchmark_ci.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results-${{ matrix.driver }}
          path: |
            benchmark_results.json
            benchmark_report.html
